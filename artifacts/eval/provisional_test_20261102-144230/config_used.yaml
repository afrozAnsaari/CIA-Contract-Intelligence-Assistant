  doc_routing:
    enabled: false
    top_n_docs: 1
    doc_text: title_head
    head_chars: 3000
abstention:
  enabled: true
  signal: chunk_bm25_norm
  threshold: 0.24180059226281184
  calibrate: true
evaluation:
  k_values:
  - 1
  - 2
  - 4
  - 5
  - 8
  - 16
  - 32
  - 64
