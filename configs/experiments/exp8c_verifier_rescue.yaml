# Experiment 8c (POST-HOC): candidate_v4 + verifier in rescue mode: answer iff BM25 answers OR the
# verifier finds verbatim support in the top 5 passages. Designed after exp8/exp8b train results were
# seen (REPORT.md §13); its train numbers are in-sample and post-hoc, not evidence of improvement.
name: exp8c_verifier_rescue
status: experiment
data:
  raw_dir: data/raw/legalbench-rag
  benchmark: benchmarks/cuad.json
  mini_n: 194
  processed_dir: data/processed
  unanswerable_path: data/unanswerable_queries.json
chunking:
  strategy: paragraph
  max_chars: 1000
  overlap_chars: 300
  min_chars: 20
  boundary_search_frac: 0.3
text:
  lowercase: true
  stopwords: true
  stemming: true
query:
  mode: split
  chunk_query: question
  require_contract: true
  drop_generic_terms: true
  expand: true
  expansion_weight: 0.5
retrieval:
  method: bm25
  max_k: 64
  overlap_policy: trim
  min_trimmed_chars: 50
  refine:
    enabled: false
    max_chars: 600
  index_doc_title: false
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 32
    query_prefix: ''
    passage_prefix: ''
  hybrid:
    rrf_k: 60
    bm25_weight: 1.0
    dense_weight: 1.0
    pool: 200
  doc_routing:
    enabled: true
    top_n_docs: 1
    doc_text: title_head
    head_chars: 3000
verifier:
  enabled: true
  backend: llama_cpp
  model_repo: Qwen/Qwen3-1.7B-GGUF
  model_file: Qwen3-1.7B-Q8_0.gguf
  mode: rescue
  top_k: 5
  min_quote_chars: 20
  answer_on_ambiguous: false
  n_ctx: 4096
  n_threads: null
  max_new_tokens: 384
  timeout_seconds: 180
  seed: 0
  local_files_only: false
  cache: true
abstention:
  enabled: true
  signal: chunk_full_bm25_norm
  threshold: 0.27386511045480977
  doc_threshold: 0.0
  calibrate: true
evaluation:
  k_values:
  - 1
  - 2
  - 4
  - 5
  - 8
  - 16
  - 32
  - 64
  primary_k: 5
output:
  artifacts_dir: artifacts
