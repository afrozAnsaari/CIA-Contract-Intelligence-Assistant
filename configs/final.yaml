# Final configuration (promoted 2026-11-06, REPORT.md §14) = configs/candidate_v4.yaml, which was
# accepted by the train-only loop run 4 (artifacts/loop/run4_v4/accepted_config.yaml).
# Held-out test: run #5 in artifacts/test_runs.jsonl (fingerprint 8f6d2afd50a4819e).
# The previous final (overlap_up) is archived at configs/archive/final_overlap_up.yaml.
name: final_v4
status: final
data:
  raw_dir: data/raw/legalbench-rag
  benchmark: benchmarks/cuad.json
  mini_n: 194
  processed_dir: data/processed
  unanswerable_path: data/unanswerable_queries.json
chunking:
  strategy: paragraph
  max_chars: 1000
  overlap_chars: 300
  min_chars: 20
  boundary_search_frac: 0.3
text:
  lowercase: true
  stopwords: true
  stemming: true
query:
  mode: split
  chunk_query: question
  require_contract: true
  drop_generic_terms: true
  expand: true
  expansion_weight: 0.5
retrieval:
  method: bm25
  max_k: 64
  overlap_policy: trim
  min_trimmed_chars: 50
  refine:
    enabled: false
    max_chars: 600
  index_doc_title: false
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 32
    query_prefix: ''
    passage_prefix: ''
  hybrid:
    rrf_k: 60
    bm25_weight: 1.0
    dense_weight: 1.0
    pool: 200
  doc_routing:
    enabled: true
    top_n_docs: 1
    doc_text: title_head
    head_chars: 3000
abstention:
  enabled: true
  signal: chunk_full_bm25_norm
  threshold: 0.27386511045480977
  doc_threshold: 0.0
  calibrate: true
evaluation:
  k_values:
  - 1
  - 2
  - 4
  - 5
  - 8
  - 16
  - 32
  - 64
  primary_k: 5
output:
  artifacts_dir: artifacts
